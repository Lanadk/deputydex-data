name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests unitaires avec couverture : le rapport lcov est repris par `sonar`.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  # SonarQube Cloud (projet public) : qualité du code + couverture des tests
  # unitaires. Informatif, ne bloque rien ; ignoré sans le secret SONAR_TOKEN
  # (PR venant d'un fork). Mise en place : SONAR.md.
  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "present=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Historique complet : blame et « nouveau code » d'une PR.
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-lcov
          path: coverage
      # Épinglée sur le commit de la v8.5.0 (action tierce qui reçoit un secret).
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-integration:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deputydex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/deputydex_test?schema=public
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: deputydex_test
      DB_USER_WRITER: postgres
      DB_PASSWORD_WRITER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  sync-schema:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        # Épinglée sur le commit de la v3.0.4 (action tierce).
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            schema:
              - 'prisma/schema.prisma'
      - name: Checkout deputydex
        if: steps.filter.outputs.schema == 'true'
        uses: actions/checkout@v4
        with:
          repository: lanadk/deputydex
          ref: main
          token: ${{ secrets.DEPUTYDEX_PUSH_TOKEN }}
          path: deputydex
      - name: Sync schema.prisma into deputydex
        if: steps.filter.outputs.schema == 'true'
        run: |
          mkdir -p deputydex/app/infrastructure/db/prisma
          cp prisma/schema.prisma deputydex/app/infrastructure/db/prisma/schema.prisma
          cd deputydex
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/infrastructure/db/prisma/schema.prisma
          if git diff --staged --quiet; then
            echo "schema.prisma already in sync, nothing to commit"
          else
            git commit -m "chore: sync schema.prisma from deputydex-data@${{ github.sha }}"
            git push
          fi

  trigger-deploy:
    needs: sync-schema
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Épinglée sur le commit de la v3.0.0 (action tierce qui reçoit un jeton).
      - uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.CD_DISPATCH_TOKEN }}
          repository: lanadk/deputydex-cd
          event-type: deploy-etl
