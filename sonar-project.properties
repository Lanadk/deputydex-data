# =============================================================================
# SonarQube Cloud — analyse de l'ETL, lancée par la CI (job `sonar` de
# .github/workflows/ci.yml). Clés : SonarQube Cloud > projet > Information.
# =============================================================================
sonar.organization=lanadk
sonar.projectKey=Lanadk_deputydex-data
sonar.projectName=DeputyDex Data

# Code : src/ (TypeScript et SQL), tests à part, client Prisma généré exclu.
sonar.sources=src,prisma,local
sonar.exclusions=**/*.spec.ts,generated/**,prisma/migrations/**
sonar.tests=src,prisma,local
sonar.test.inclusions=**/*.spec.ts

# Couverture : tests unitaires (`npm run test:coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
